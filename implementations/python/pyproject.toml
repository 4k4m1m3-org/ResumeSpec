[project]
name = "resumespec-validator"
version = "1.0.0"
description = "Reference parser and validator implementation for ResumeSpec"
requires-python = ">=3.11"

dependencies = [
    "defusedxml>=0.7.1",
    "jsonschema",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
resumespec = "resumespec.cli:main"

[tool.setuptools.package-data]
resumespec = ["schemas/json/*.json"]
